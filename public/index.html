<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MANASTAVA CORE</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="bg-dark"></div>

    <div class="interface">
        
        <header>
            <div class="brand">MANASTAVA <span class="tag">AI</span></div>
            <div class="status-indicator">SYSTEM ONLINE</div>
        </header>

        <div class="core-wrapper">
            <div id="ai-circle" class="neon-circle">
                <div class="inner-glow"></div>
            </div>
        </div>

        <div class="chat-area">
            <p id="user-text" class="user-line">...</p>
            <p id="ai-text" class="ai-line"></p> 
        </div>

        <div class="controls">
            
            <button id="stop-btn" class="hidden">
                <div class="icon">⏹</div>
            </button>

            <button id="mic-btn">
                <div class="icon">🎙</div>
            </button>
            
            <p class="hint">TAP MIC TO SPEAK</p>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
