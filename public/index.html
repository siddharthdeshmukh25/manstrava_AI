<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MANASTAVA CORE</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="bg-dark"></div>

    <div class="interface">
        
        <header>
            <div class="brand">MANASTAVA <span class="tag">AI</span></div>
            <div class="status-indicator">SYSTEM ONLINE</div>
        </header>

        <div id="robot-container" class="idle-mode">
            
            <div class="robot-full">
                <img src="assets/images/minirobot1.png" alt="Full Robot" id="robot-full-img">
                <div class="mouth-glow"></div> </div>

            <div class="robot-mini">
                <img src="assets/images/mini_robot_head.png" alt="Mini Robot" id="robot-mini-img">
            </div>

        </div>
        <div class="chat-area">
            <p id="user-text" class="user-line">...</p>
            <p id="ai-text" class="ai-line"></p> 
        </div>

        <div class="controls">
            <button id="stop-btn" class="hidden"><div class="icon">⏹</div></button>
            <button id="mic-btn"><div class="icon">🎙</div></button>
            <p class="hint">TAP MIC TO SPEAK</p>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
